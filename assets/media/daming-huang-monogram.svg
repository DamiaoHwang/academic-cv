<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">Daming Huang monogram</title>
  <desc id="desc">The initials DH on a deep blue field with warm copper accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2a40"/>
      <stop offset="1" stop-color="#245b78"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d49a73"/>
      <stop offset="1" stop-color="#a75331"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" rx="400" fill="url(#bg)"/>
  <circle cx="400" cy="400" r="332" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/>
  <path d="M118 560 C250 420 338 326 420 184" fill="none" stroke="url(#accent)" stroke-width="28" stroke-linecap="round" opacity=".9"/>
  <path d="M680 236 C560 314 474 414 382 602" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity=".16"/>
  <text x="400" y="480" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="250" font-weight="700" text-anchor="middle" letter-spacing="-18">DH</text>
  <circle cx="632" cy="620" r="18" fill="#d49a73"/>
</svg>
